# DigitalOcean App Platform spec.
# Deploy with: doctl apps create --spec .do/app.yaml
# Or via the DO dashboard: Create App -> pick this GitHub repo -> it auto-detects this file.
#
# Fill in <your-github-user>/<repo> below, and set SMTP_* / CONTACT_TO_EMAIL
# as encrypted values in the dashboard (do not commit real secrets here).
name: fahrschulring-stuttgart
region: fra
services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: <your-github-user>/<repo>
      branch: main
      deploy_on_push: true
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: NEXT_PUBLIC_SITE_URL
        value: https://www.fahrschulring.de
      - key: SMTP_HOST
        type: SECRET
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        type: SECRET
      - key: SMTP_PASS
        type: SECRET
      - key: CONTACT_TO_EMAIL
        value: info@fahrschulring.de
    health_check:
      http_path: /
